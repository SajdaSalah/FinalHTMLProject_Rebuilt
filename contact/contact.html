<!-- صفحة تواصل معنا - احترافية -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>تواصل معنا</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body  class="bg-black bg-gradient text-white d-flex flex-column min-vh-100  ">
    <header class="bg-dark bg-opacity-50 border-bottom border-white border-opacity-25 py-3 mb-4">
  <div class="container d-flex justify-content-between align-items-center" style="max-width: 600px;">
    <h1 class="h4 text-white fw-bold m-0">تواصل معنا</h1>
    <nav>
      <a href="index.html" class="text-info text-decoration-underline link-offset-2 fw-semibold">الصفحة الرئيسية</a>
    </nav>
  </div>
</header>

   
    </main>
    <main class="flex-grow-1 container my-4" style="max-width: 600px;">

  
  <section class="text-center mb-4 py-3 rounded-4 bg-primary bg-opacity-25 border border-primary border-opacity-50">
    <h2 class="h3 fw-bold m-0">نحن هنا من أجلك</h2>
    <p class="text-white-50 small mt-1 mb-0">إذا كان لديك أي استفسار، لا تردد في التواصل معنا.</p>
  </section>


  <section class="mb-4">
    <h3 class="h5 fw-bold mb-3">نموذج التواصل</h3>
    <form class="p-4 rounded-4 bg-white bg-opacity-10 border border-white border-opacity-25">
      <div class="mb-3">
        <label for="name" class="form-label">الاسم الكامل:</label>
        <input type="text" id="name" class="form-control bg-dark text-white border-secondary">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">البريد الإلكتروني:</label>
        <input type="email" id="email" class="form-control bg-dark text-white border-secondary">
      </div>
      <div class="mb-3">
        <label for="subject" class="form-label">الموضوع:</label>
        <input type="text" id="subject" name="subject" class="form-control bg-dark text-white border-secondary">
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">الرسالة:</label>
        <textarea id="message" name="message" rows="4" class="form-control bg-dark text-white border-secondary"></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-bold">إرسال الرسالة</button>
    </form>
  </section>


  <section class="p-4 rounded-4 bg-white bg-opacity-10 border border-white border-opacity-25">
    <h3 class="h5 fw-bold mb-3">معلومات التواصل</h3>
    <p class="mb-2">📧 <strong>البريد الإلكتروني:</strong> <a href="mailto:contact@academy.com" class="text-info text-decoration-underline link-offset-2">contact@academy.com</a></p>
    <p class="mb-2">📞 <strong>الهاتف:</strong> <span class="dir-ltr d-inline-block">+966 123 456 789</span></p>
    <p class="mb-0">📍 <strong>العنوان:</strong> الرياض، المملكة العربية السعودية</p>
  </section>

</main>

   <footer  class= " bg-primary text-white mt-auto py-3">
        <p>© 2025 أكاديمية البرمجة - جميع الحقوق محفوظة</p>
    </footer>
</body>
</html>
