<!-- إعدادات الحساب -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>الإعدادات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body  class="bg-black bg-gradient text-white d-flex flex-column min-vh-100  ">
    <header>
        <h1 class="fixed-top text-center bg-primary">إعدادات الحساب</h1>
        <nav class=" mt-5"><a href="index.html">الصفحة الرئيسية</a></nav>
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </header>

    <main class="flex-grow-1 mt-5">
        <section>
          
            <form class="p-4 rounded-4 bg-white bg-opacity-10 border border-white border-opacity-25 shadow-lg text-white mx-auto" style="max-width: 450px;">
  <h4 class="mb-4 text-center fw-bold">تفضيلات المستخدم</h4>

 
  <div class="mb-3">
    <label for="languageSelect" class="form-label fw-semibold">اللغة المفضلة:</label>
    <select id="languageSelect" class="form-select bg-dark bg-opacity-50 text-white border-white border-opacity-25 shadow-none">
      <option value="ar" selected class="bg-dark text-white">العربية</option>
      <option value="en" class="bg-dark text-white">English</option>
    </select>
  </div>


  <div class="mb-3">
    <label class="form-label fw-semibold d-block">تفعيل الإشعارات:</label>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="emailNotif" checked>
      <label class="form-check-label" for="emailNotif">بريد إلكتروني</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="smsNotif">
      <label class="form-check-label" for="smsNotif">رسائل نصية</label>
    </div>
  </div>

  
  <div class="mb-4">
    <label class="form-label fw-semibold d-block">اختيار المظهر:</label>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="themeOptions" id="lightTheme" value="light">
      <label class="form-check-label" for="lightTheme">فاتح</label>
    </div>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="themeOptions" id="darkTheme" value="dark" checked>
      <label class="form-check-label" for="darkTheme">داكن</label>
    </div>
  </div>

  
  <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 shadow">حفظ الإعدادات</button>
</form>
        </section>
    </main>

  <footer  class= " bg-primary text-white mt-auto py-3">
        <p>© 2025 إعدادات الحساب - جميع الحقوق محفوظة</p>
    </footer>
</body>
</html>
