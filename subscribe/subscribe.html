<!-- صفحة الاشتراك -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>اشترك الآن</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body  class="bg-black bg-gradient text-white d-flex flex-column min-vh-100  ">
    <header class="bg-dark bg-opacity-50 border-bottom border-white border-opacity-25 py-3 mb-4">
    <div class="container d-flex justify-content-between align-items-center" style="max-width: 600px;">
        <h1 class="h4 text-white fw-bold m-0">اشترك في المنصة</h1>
        <nav>
            <a href="index.html" class="text-info text-decoration-underline link-offset-2 fw-semibold">الصفحة الرئيسية</a>
        </nav>
    </div>
</header>

<main class="flex-grow-1 container d-flex justify-content-center align-items-center my-4">
    <section class="w-100" style="max-width: 500px;">
        <form class="p-4 rounded-4 bg-white bg-opacity-10 border border-white border-opacity-25 shadow">
            
            <div class="mb-3">
                <label class="form-label">الاسم الكامل:</label><br>
                <input type="text" placeholder="أحمد علي" class="form-control bg-dark text-white border-secondary">
            </div>

            <div class="mb-3">
                <label class="form-label">البريد الإلكتروني:</label><br>
                <input type="email" placeholder="you@example.com" class="form-control bg-dark text-white border-secondary">
            </div>

            <div class="mb-3">
                <label class="form-label">كلمة المرور:</label><br>
                <input type="password" class="form-control bg-dark text-white border-secondary">
            </div>

            <div class="mb-3">
                <label class="form-label">تأكيد كلمة المرور:</label><br>
                <input type="password" class="form-control bg-dark text-white border-secondary">
            </div>

            <button class="btn btn-primary w-100 fw-bold" type="submit">اشترك الآن</button>

        </form>
    </section>
</main>

<footer class="bg-dark bg-opacity-50 border-top border-white border-opacity-25 mt-auto py-3 text-center">
    <p class="text-white-50 m-0">© 2025 الاشتراك في المنصة</p>
</footer>
</body>
</html>
